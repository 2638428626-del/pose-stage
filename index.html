<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3D 姿势预演台 · 免费 AI 生图参考</title>
  <meta name="description" content="免费的 3D 姿势预演台：拖动人偶摆姿势，调机位、焦距与灯光，一键导出 3:4 参考图，用于 AI 生图与垫图。全程浏览器本地渲染，不上传图片。" />
  <meta name="theme-color" content="#F1EEE8" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="3D 姿势预演台 · 免费 AI 生图参考" />
  <meta property="og:description" content="拖动人偶摆姿势，调机位与灯光，导出 1080×1440 参考图。免费、无需注册、本地渲染。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231F1D1A'/%3E%3Ccircle cx='16' cy='9' r='3.2' fill='%23F7F4EE'/%3E%3Cpath d='M16 13v8M10 17l6 2 6-2M16 21l-3 6M16 21l3 6' stroke='%23F7F4EE' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background: #F1EEE8;
      color: #1F1D1A;
      overflow: hidden;
    }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="5" r="2.4" />
            <path d="M12 8v6" />
            <path d="M6.5 10.5 12 12l5.5-1.5" />
            <path d="M12 14l-3 6.5" />
            <path d="M12 14l3 6.5" />
          </svg>
        </span>
        <div class="brand-text">
          <p class="brand-name">姿势预演台</p>
          <p class="brand-sub">免费 3D 姿势参考 · 为 AI 生图服务</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="free-pill">免费</span>
        <button class="save-btn" id="saveBtn" type="button">下载参考图</button>
      </div>
    </header>

    <div class="workspace">
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage">
          <canvas id="gl"></canvas>
          <span class="frame-corner fc-tl" id="fcTL" aria-hidden="true"></span>
          <span class="frame-corner fc-tr" id="fcTR" aria-hidden="true"></span>
          <span class="frame-corner fc-bl" id="fcBL" aria-hidden="true"></span>
          <span class="frame-corner fc-br" id="fcBR" aria-hidden="true"></span>
          <p class="stage-hint" id="hint">拖动空白处转视角 · 拖动关节摆姿势 · 滚轮缩放</p>
          <div class="stage-loading" id="loading">正在准备 3D 场景</div>
          <div class="stage-overlay" id="overlay" hidden>
            <p class="overlay-title" id="overlayTitle">无法启用 3D 渲染</p>
            <p class="overlay-text" id="overlayText">当前浏览器没有可用的 WebGL，换新版 Chrome、Edge 或 Safari 再试。</p>
          </div>
        </div>
      </div>

      <aside class="aside">
        <nav class="tabs" id="tabs" aria-label="控制面板">
          <button class="tab is-active" type="button" data-tab="pose">姿势</button>
          <button class="tab" type="button" data-tab="camera">机位</button>
          <button class="tab" type="button" data-tab="light">灯光</button>
          <button class="tab" type="button" data-tab="scene">场景</button>
        </nav>

        <div class="panels">
          <section class="panel is-active" data-panel="pose">
            <h2 class="section-title">姿势</h2>
            <div class="chip-row" id="poseChips"></div>
            <div class="row-between">
              <span class="inline-note" id="jointLabel">未选中关节</span>
              <button class="text-btn" id="resetPoseBtn" type="button">重置姿势</button>
            </div>
          </section>

          <section class="panel" data-panel="camera">
            <h2 class="section-title">机位</h2>
            <div class="field">
              <span class="field-label">景别</span>
              <div class="chip-row" id="frameChips"></div>
            </div>
            <div class="field">
              <span class="field-label">镜头</span>
              <div class="chip-row" id="lensChips"></div>
            </div>
            <label class="slider">
              <span class="slider-name">机位高度</span>
              <input type="range" id="pitchRange" min="-20" max="55" value="4" />
              <em class="slider-val" id="pitchVal">4°</em>
            </label>
          </section>

          <section class="panel" data-panel="light">
            <h2 class="section-title">灯光</h2>
            <div class="field">
              <div class="row-between field-head">
                <span class="field-label">光位</span>
                <span class="rim-line">轮廓光<button class="switch is-on" id="rimToggle" type="button" aria-pressed="true"></button></span>
              </div>
              <div class="light-grid" id="lightGrid"></div>
            </div>
            <label class="slider">
              <span class="slider-name">高度</span>
              <input type="range" id="lightEl" min="5" max="85" value="38" />
              <em class="slider-val" id="lightElVal">38°</em>
            </label>
            <label class="slider">
              <span class="slider-name">强度</span>
              <input type="range" id="lightIn" min="50" max="140" value="100" />
              <em class="slider-val" id="lightInVal">100%</em>
            </label>
          </section>

          <section class="panel" data-panel="scene">
            <h2 class="section-title">场景</h2>
            <div class="field">
              <span class="field-label">背景</span>
              <div class="chip-row" id="bgChips"></div>
            </div>
            <div class="field">
              <span class="field-label">道具</span>
              <div class="chip-row" id="propChips"></div>
            </div>
            <p class="panel-note">导出尺寸 1080 × 1440，比例 3:4。</p>
          </section>
        </div>

        <p class="aside-foot">浏览器本地渲染，图片不会上传。免费使用，无需登录。</p>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <p class="modal-title">参考图已生成</p>
      <p class="modal-sub" id="modalSub">手机上长按图片即可保存到相册。</p>
      <div class="modal-media"><img id="previewImg" alt="3D 姿势参考图预览" /></div>
      <div class="modal-actions">
        <button class="ghost-btn" id="modalClose" type="button">关闭</button>
        <button class="save-btn" id="modalSave" type="button">下载 PNG</button>
      </div>
    </div>
  </div>

  <script src="./engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
